server {
    listen 80;
    server_name duoduo.best www.duoduo.best;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 300M;

    location ~* \.(m4a|mp3|flac|ogg|wav|jpg|jpeg|png|gif|css|js)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~* \.(yml|yaml|env|git|sql)$ {
        deny all;
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/v.duoduo.best.crt;
    ssl_certificate_key /etc/nginx/ssl/v.duoduo.best.key;

    location / {
        return 404;
    }
}
