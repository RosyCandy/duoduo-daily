server {
    listen 80;
    server_name duoduo.best www.duoduo.best;

    # Let's Encrypt 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name duoduo.best www.duoduo.best;

    ssl_certificate     /etc/nginx/ssl/certbot/live/duoduo.best/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/certbot/live/duoduo.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 300M;

    location ~* \.(m4a|mp3|flac|ogg|wav|jpg|jpeg|png|gif|css|js)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~* \.(yml|yaml|env|git|sql)$ {
        deny all;
        return 404;
    }
}
