services:

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - php
      - mysql
    networks:
      - web
    mem_limit: 64m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  php:
    image: duoduo-php:latest
    build: ./php
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-blog_db}
      DB_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BLOG_ADMIN_USERNAME: ${BLOG_ADMIN_USERNAME:-}
      BLOG_ADMIN_PASSWORD: ${BLOG_ADMIN_PASSWORD:-}
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php/zz-low-memory.conf:/usr/local/etc/php-fpm.d/zz-low-memory.conf:ro
      - ./php/low-memory.ini:/usr/local/etc/php/conf.d/zz-low-memory.ini:ro
    depends_on:
      - mysql
    networks:
      - web
    mem_limit: 192m
    memswap_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0.46
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_db}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    networks:
      - web
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    mem_limit: 448m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP -uroot -h127.0.0.1 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
